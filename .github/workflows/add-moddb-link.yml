name: Add ModDB link

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-moddb-link.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add ModDB link and correct presentation wording
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('projects/system-shock-android/index.html')
          text = path.read_text(encoding='utf-8')

          old_hero = '<a class="button button-secondary" href="#feedback-contact">Feedback</a><a class="button button-secondary" href="https://github.com/Interrupt/systemshock" target="_blank" rel="noopener noreferrer">Shockolate upstream</a><a class="button button-secondary" href="#references">References</a>'
          new_hero = '<a class="button button-secondary" href="#feedback-contact">Feedback</a><a class="button button-secondary" href="https://www.moddb.com/mods/system-shock-android" target="_blank" rel="noopener noreferrer">ModDB</a><a class="button button-secondary" href="https://github.com/Interrupt/systemshock" target="_blank" rel="noopener noreferrer">Shockolate upstream</a><a class="button button-secondary" href="#references">References</a>'

          old_quick = '<a href="https://github.com/raposomiguel50/system-shock-android/issues/new/choose" target="_blank" rel="noopener noreferrer">Feedback →</a>'
          new_quick = '<a href="https://github.com/raposomiguel50/system-shock-android/issues/new/choose" target="_blank" rel="noopener noreferrer">Feedback →</a>\n          <a href="https://www.moddb.com/mods/system-shock-android" target="_blank" rel="noopener noreferrer">ModDB →</a>'

          old_wording = 'Display behavior, controller routing, Android lifecycle, audio timing, text input and widescreen presentation are validated against the handheld itself.'
          new_wording = 'Display behavior, controller routing, Android lifecycle, audio timing, text input and 4:3 presentation are validated against the handheld itself.'

          for old, new in [(old_hero, new_hero), (old_quick, new_quick), (old_wording, new_wording)]:
              if old not in text:
                  raise SystemExit('Expected text not found')
              text = text.replace(old, new, 1)

          if '\u2014' in text:
              raise SystemExit('em dash found in project page')

          path.write_text(text, encoding='utf-8', newline='\n')
          print('MODDB_LINK_UPDATE=PASS')
          PY
      - name: Validate and commit
        shell: bash
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add projects/system-shock-android/index.html
          git rm .github/workflows/add-moddb-link.yml
          git commit -m 'Add ModDB link to System Shock project page'
          git push origin HEAD:main
