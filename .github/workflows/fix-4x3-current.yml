name: Correct current presentation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-4x3-current.yml'

permissions:
  contents: write

jobs:
  correct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Correct current presentation documentation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              'index.html': [
                  (
                      'Playable core port with handheld controls, Android text input, audio integration, no-stretch 4:3 presentation and a validated Hor+ path. The public source preview is now available on GitHub together with the reproduction guide and open engineering knowledge base.',
                      'Playable core port with handheld controls, Android text input, audio integration and a preserved no-stretch 4:3 presentation. The Android IME keyboard shown during text entry is the only platform-specific visual addition. The public source preview is available on GitHub together with the reproduction guide and open engineering knowledge base.'
                  ),
              ],
              'projects/system-shock-android/index.html': [
                  (
                      'Native System Shock Android ARM64 port based on Shockolate, developed for Retroid Pocket 5 with source code, Hor+ widescreen, controls, build guide and engineering notes.',
                      'Native System Shock Android ARM64 port based on Shockolate, developed for Retroid Pocket 5 with source code, preserved 4:3 presentation, controls, build guide and engineering notes.'
                  ),
                  (
                      'Android lifecycle, input, audio, widescreen presentation, legacy assets and reproducible porting.',
                      'Android lifecycle, input, audio, presentation, legacy assets and reproducible porting.'
                  ),
                  (
                      'Current validated baseline: P2.0B + P2.0A Hor+',
                      'Presentation: 1024x768 4:3 only'
                  ),
                  (
                      '<article class="metric-card"><span class="metric-label">DISPLAY</span><strong>4:3 + Hor+</strong><p>1024×768 no-stretch reference presentation, plus a validated reversible 1366×768 Hor+ path with a centered 1024×768 UI safe area.</p></article>',
                      '<article class="metric-card"><span class="metric-label">DISPLAY</span><strong>4:3 preserved</strong><p>1024x768 no-stretch presentation remains the current and only public presentation mode.</p></article>'
                  ),
                  (
                      '<h2>Preserve first, extend second</h2>',
                      '<h2>Preserve the original presentation</h2>'
                  ),
                  (
                      '<div class="content-card"><h3>Hor+ widescreen</h3><p>A 1366×768 logical mode expands the world horizontally while retaining a centered 1024×768 safe area for legacy UI. 4:3 remains a reversible fallback.</p></div>',
                      '<div class="content-card"><h3>Current presentation decision</h3><p>The port retains the original-style 1024x768 4:3 no-stretch presentation as its only public presentation mode. The Android IME keyboard shown during text entry is the only platform-specific visual addition.</p></div>'
                  ),
              ],
              'projects/system-shock-android/reproduce/index.html': [
                  (
                      'Check menu/gameplay, 4:3 or Hor+ presentation, right-stick look/cursor toggle, touchscreen pointer behavior, Android text input and game audio.',
                      'Check menu/gameplay, 4:3 presentation, right-stick look/cursor toggle, touchscreen pointer behavior, Android text input and game audio.'
                  ),
              ],
              'projects/system-shock-android/knowledge/index.html': [
                  (
                      'Engineering knowledge from porting System Shock to Android: SDL, ARM64, controls, audio, Hor+ widescreen, reproducible builds, failures, fixes and reusable lessons.',
                      'Engineering knowledge from porting System Shock to Android: SDL, ARM64, controls, audio, 4:3 presentation, reproducible builds, failures, fixes and reusable lessons.'
                  ),
                  (
                      '<article class="project-card" id="kb-ss-007" style="margin-top:1rem">\n          <div class="project-meta"><span>KB-SS-007</span><span>VALIDATED BASELINE</span><span>WIDESCREEN</span></div>\n          <h3>Hor+ instead of stretching 4:3</h3>\n          <p><strong>Problem.</strong> Filling a 16:9 display must not horizontally distort the original scene and UI.</p>\n          <p><strong>Resolution.</strong> The 1366×768 Hor+ prototype widens world coverage while retaining a centered 1024×768 legacy UI safe area at x=171. The original 4:3 presentation remains independently reversible.</p>\n          <p><strong>Validation.</strong> Geometry, UI, input and 4:3 fallback passed RP5 QA.</p>\n          <p><strong>Reusable lesson.</strong> Preserve a known reference presentation and make widescreen reversible before optimizing it.</p>\n        </article>',
                      '<article class="project-card" id="kb-ss-007" style="margin-top:1rem">\n          <div class="project-meta"><span>KB-SS-007</span><span>CURRENT DECISION</span><span>PRESENTATION</span></div>\n          <h3>4:3 presentation retained as the current baseline</h3>\n          <p><strong>Context.</strong> A 16:9 expansion prototype was evaluated during development.</p>\n          <p><strong>Decision.</strong> The current port does not expose a switchable widescreen mode. It retains the original-style 1024x768 4:3 no-stretch presentation as the only public presentation mode.</p>\n          <p><strong>Visual boundary.</strong> The Android IME keyboard shown during text entry is the only platform-specific visual addition to the original game presentation.</p>\n          <p><strong>Reusable lesson.</strong> A technically workable presentation experiment does not need to become a shipped feature when visual consistency and fidelity are better served by the reference format.</p>\n        </article>'
                  ),
                  (
                      '<div class="content-card"><h3>Reversibility</h3><p>Keep a known-good baseline. Widescreen, HD and other experiments should be independently disableable until they pass their own quality gates.</p></div>',
                      '<div class="content-card"><h3>Reversibility</h3><p>Keep a known-good baseline. Presentation, HD and other experiments should remain isolated until they pass their own quality gates.</p></div>'
                  ),
              ],
          }

          for filename, pairs in replacements.items():
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              for old, new in pairs:
                  if old not in text:
                      raise SystemExit(f'Expected text not found in {filename}: {old[:80]}')
                  text = text.replace(old, new)
              if '\u2014' in text:
                  raise SystemExit(f'em dash found in {filename}')
              path.write_text(text, encoding='utf-8', newline='\n')

          for filename in replacements:
              text = Path(filename).read_text(encoding='utf-8')
              if 'Hor+' in text:
                  raise SystemExit(f'stale Hor+ claim remains in {filename}')

          print('FOUR_THREE_CORRECTION=PASS')
          PY
      - name: Validate and commit
        shell: bash
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html projects/system-shock-android/index.html projects/system-shock-android/reproduce/index.html projects/system-shock-android/knowledge/index.html
          git commit -m 'Correct System Shock presentation to 4:3 only'
          git push origin HEAD:main
