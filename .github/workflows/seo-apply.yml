name: Apply site SEO

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply-seo.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply SEO
        run: python scripts/apply-seo.py
      - name: Validate and commit
        shell: bash
        run: |
          git diff --check
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo 'SEO_NO_CHANGES=PASS'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html projects/system-shock-android/index.html projects/system-shock-android/reproduce/index.html projects/system-shock-android/knowledge/index.html sitemap.xml robots.txt
          git commit -m 'Apply SEO metadata and Google discovery files'
          git push origin HEAD:main
